<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora ELO · Mus Güsak</title>
<style>
  :root{
    --bg: #F4F5F7;
    --card: #FFFFFF;
    --border: #E3E5E9;
    --ink: #1D2129;
    --ink-soft: #6B7280;
    --blue: #2952CC;
    --blue-soft: #EEF2FE;
    --green: #1F8A4C;
    --green-soft: #EAF7EF;
    --red: #C23B3B;
    --red-soft: #FCEEEE;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }

  header{ margin-bottom: 28px; }
  h1{ font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .subtitle{ font-size: 14.5px; color: var(--ink-soft); margin: 0; }

  .status{
    display:flex; align-items:center; gap:8px;
    font-size: 13px; color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .status .dot{ width:7px; height:7px; border-radius:50%; background:#C4C8D0; flex-shrink:0; }
  .status.ok .dot{ background: var(--green); }
  .status.error .dot{ background: var(--red); }
  .status.error{ color: var(--red); }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2{
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }

  .field{ margin-bottom: 14px; }
  .field:last-child{ margin-bottom: 0; }
  .field label{
    display:block;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field.win label{ color: var(--green); }
  .field.lose label{ color: var(--red); }

  select{
    width: 100%;
    font-size: 15px;
    font-family: inherit;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%236B7280" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>');
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 34px;
  }
  select:focus{ outline: none; border-color: var(--blue); background-color: #fff; }

  .pair-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn{
    width: 100%;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--blue);
    color: #fff;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn:hover{ background: #2145b0; }
  .btn:active{ transform: translateY(1px); }

  .error-msg{
    font-size: 13.5px;
    color: var(--red);
    background: var(--red-soft);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 12px;
  }

  .result-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .result-row:last-child{ border-bottom: none; }

  .result-left{ display:flex; align-items:center; gap: 10px; min-width:0; }
  .badge{
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .badge.win{ background: var(--green-soft); color: var(--green); }
  .badge.lose{ background: var(--red-soft); color: var(--red); }
  .result-name{ font-weight: 600; font-size: 15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .result-right{ display:flex; align-items:center; gap: 12px; flex-shrink:0; }
  .delta{ font-size: 14px; font-weight: 700; min-width: 42px; text-align:right; }
  .delta.up{ color: var(--green); }
  .delta.down{ color: var(--red); }
  .elo-change{ font-size: 13px; color: var(--ink-soft); white-space:nowrap; }
  .elo-change .new{ color: var(--ink); font-weight: 600; }

  table{ width:100%; border-collapse: collapse; }
  thead th{
    text-align:left;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    padding: 6px 4px 10px;
    border-bottom: 1px solid var(--border);
  }
  thead th.num{ text-align:right; }
  tbody td{ padding: 8px 4px; font-size: 14.5px; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody td.num{ text-align:right; font-weight: 600; }
  tbody td.rank{ color: var(--ink-soft); width: 24px; }

  #resultCard{ display:none; }

  @media (max-width: 420px){
    .pair-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Calculadora ELO · Mus</h1>
    <p class="subtitle">Elige la pareja ganadora y la perdedora. El cálculo sale al momento.</p>
  </header>

  <p class="status" id="status"><span class="dot"></span><span id="statusText">Cargando jugadores…</span></p>

  <div class="card">
    <h2>Pareja ganadora</h2>
    <div class="pair-grid">
      <div class="field win">
        <label for="win1">Jugador 1</label>
        <select id="win1"><option value="">Selecciona…</option></select>
      </div>
      <div class="field win">
        <label for="win2">Jugador 2</label>
        <select id="win2"><option value="">Selecciona…</option></select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Pareja perdedora</h2>
    <div class="pair-grid">
      <div class="field lose">
        <label for="lose1">Jugador 1</label>
        <select id="lose1"><option value="">Selecciona…</option></select>
      </div>
      <div class="field lose">
        <label for="lose2">Jugador 2</label>
        <select id="lose2"><option value="">Selecciona…</option></select>
      </div>
    </div>
    <button class="btn" id="calcBtn">Calcular</button>
    <p class="error-msg" id="errorMsg" style="display:none;"></p>
  </div>

  <div class="card" id="resultCard">
    <h2>Resultado</h2>
    <div id="resultBody"></div>
  </div>

  <div class="card">
    <h2>Ranking actual</h2>
    <table>
      <thead>
        <tr><th class="rank">#</th><th>Jugador</th><th class="num">ELO</th></tr>
      </thead>
      <tbody id="rankingBody">
        <tr><td colspan="3" style="color:var(--ink-soft);">Sin datos todavía</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
/* ============================================================
   Fuente de datos: Google Sheet publicada como CSV.
   Columnas esperadas: Jugador, ELO
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS6FZZe3x0lW1-5EIl1J64CM087PlaEpSKGznZ8CNOFwFqZdpIN36zzz3pZAziH9SASn8cbe0-ZQ1zQ/pub?gid=1765204250&single=true&output=csv";

const K_TEAM = 32;
let PLAYERS = [];

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell.trim() !== ""));
}

function rowsToPlayers(rows) {
  const [header, ...body] = rows;
  const norm = h => h.trim().toLowerCase();
  const iNombre = header.findIndex(h => ["jugador", "nombre"].includes(norm(h)));
  const iElo = header.findIndex(h => norm(h) === "elo");
  return body
    .map(r => ({ nombre: r[iNombre]?.trim(), elo: parseFloat(r[iElo]) }))
    .filter(p => p.nombre && !isNaN(p.elo));
}

function expected(rSelf, rOpp) {
  return 1 / (1 + Math.pow(10, (rOpp - rSelf) / 400));
}

// Reparte el delta total de la pareja entre sus dos integrantes,
// combinando el ELO propio y el de la pareja rival.
function splitPairDelta(r1, r2, teamDelta, opponentAvg, score) {
  const e1 = expected(r1, opponentAvg);
  const e2 = expected(r2, opponentAvg);
  const raw1 = K_TEAM * (score - e1);
  const raw2 = K_TEAM * (score - e2);
  const sumRaw = raw1 + raw2;
  if (Math.abs(sumRaw) < 1e-9 || Math.sign(sumRaw) !== Math.sign(teamDelta || sumRaw)) {
    return [teamDelta / 2, teamDelta / 2];
  }
  const scale = teamDelta / sumRaw;
  return [raw1 * scale, raw2 * scale];
}

function calcularPartida(winners, losers) {
  const rW = (winners[0].elo + winners[1].elo) / 2;
  const rL = (losers[0].elo + losers[1].elo) / 2;
  const eW = expected(rW, rL);
  const eL = 1 - eW;
  const teamDeltaW = K_TEAM * (1 - eW);
  const teamDeltaL = K_TEAM * (0 - eL);
  const [dW1, dW2] = splitPairDelta(winners[0].elo, winners[1].elo, teamDeltaW, rL, 1);
  const [dL1, dL2] = splitPairDelta(losers[0].elo, losers[1].elo, teamDeltaL, rW, 0);
  return [
    { ...winners[0], delta: dW1, lado: "win" },
    { ...winners[1], delta: dW2, lado: "win" },
    { ...losers[0], delta: dL1, lado: "lose" },
    { ...losers[1], delta: dL2, lado: "lose" },
  ];
}

function fmtSigned(n) {
  const r = Math.round(n);
  return (r > 0 ? "+" : "") + r;
}

function renderRanking(players) {
  const tbody = document.getElementById("rankingBody");
  if (!players.length) {
    tbody.innerHTML = `<tr><td colspan="3" style="color:var(--ink-soft);">Sin datos todavía</td></tr>`;
    return;
  }
  const sorted = [...players].sort((a, b) => b.elo - a.elo);
  tbody.innerHTML = sorted.map((p, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td>${p.nombre}</td>
      <td class="num">${Math.round(p.elo)}</td>
    </tr>`).join("");
}

function fillSelects(players) {
  const options = `<option value="">Selecciona…</option>` +
    players
      .slice()
      .sort((a, b) => a.nombre.localeCompare(b.nombre, "es"))
      .map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join("");
  ["win1", "win2", "lose1", "lose2"].forEach(id => {
    document.getElementById(id).innerHTML = options;
  });
}

function renderResult(results) {
  const card = document.getElementById("resultCard");
  const body = document.getElementById("resultBody");
  card.style.display = "block";
  body.innerHTML = results.map(p => {
    const newElo = p.elo + p.delta;
    const deltaClass = p.delta >= 0 ? "up" : "down";
    return `<div class="result-row">
      <div class="result-left">
        <span class="badge ${p.lado}">${p.lado === "win" ? "Gana" : "Pierde"}</span>
        <span class="result-name">${p.nombre}</span>
      </div>
      <div class="result-right">
        <span class="delta ${deltaClass}">${fmtSigned(p.delta)}</span>
        <span class="elo-change">${Math.round(p.elo)} → <span class="new">${Math.round(newElo)}</span></span>
      </div>
    </div>`;
  }).join("");
  card.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.style.display = msg ? "block" : "none";
  el.textContent = msg || "";
}

function setStatus(text, kind) {
  const bar = document.getElementById("status");
  const label = document.getElementById("statusText");
  bar.classList.remove("ok", "error");
  if (kind) bar.classList.add(kind);
  label.textContent = text;
}

document.getElementById("calcBtn").addEventListener("click", () => {
  document.getElementById("resultCard").style.display = "none";
  const ids = ["win1", "win2", "lose1", "lose2"];
  const names = ids.map(id => document.getElementById(id).value);

  if (names.some(n => !n)) { showError("Selecciona los 4 jugadores."); return; }
  if (new Set(names).size !== 4) { showError("No puedes repetir el mismo jugador en dos huecos."); return; }

  const byName = n => PLAYERS.find(p => p.nombre === n);
  const winners = [byName(names[0]), byName(names[1])];
  const losers = [byName(names[2]), byName(names[3])];

  showError(null);
  renderResult(calcularPartida(winners, losers));
});

async function init() {
  try {
    setStatus("Cargando jugadores…");
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    PLAYERS = rowsToPlayers(parseCSV(text));

    if (!PLAYERS.length) {
      setStatus("La hoja se ha cargado pero no hay jugadores válidos", "error");
      return;
    }
    renderRanking(PLAYERS);
    fillSelects(PLAYERS);
    setStatus(`${PLAYERS.length} jugadores cargados`, "ok");
  } catch (err) {
    console.error(err);
    setStatus("No se han podido cargar los datos de la hoja.", "error");
  }
}

init();
</script>
</body>
</html>
